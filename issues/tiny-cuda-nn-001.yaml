    > Auto-generated from the 2026-04-21 `auto-musify` group status survey.

    ## Status
    **Incomplete** — last MUSIFY.md update: `2026-03-25` (branch: `musa`)

    ## Behavior observed
    - `FullyFusedMLP` unavailable — no wmma/PTX equivalent in MUSA (wontfix).
    - `CutlassMLP` unavailable — CUTLASS is NVIDIA SM-specific (wontfix).
    - `RTCKernel` unavailable — no MUSA NVRTC equivalent (wontfix).

    ## Impact
    - tiny-cuda-nn's headline high-performance MLP implementations are all unavailable on MUSA.
    - Only non-fused / non-CUTLASS code paths work — significant perf degradation for NeRF-style workloads.

    ## Suggested next action
    _Wontfix — hardware/SDK gap fundamental, no upstream path (wmma/PTX + NVRTC)_

  # --- Resolution ---
  rootcause:
    status: suspected
    description: "Three independent MUSA hardware/SDK gaps: (1) FullyFusedMLP requires NVIDIA wmma PTX tensor-core asm — no MUSA equivalent intrinsic; (2) CutlassMLP depends on vendored NVIDIA CUTLASS (NVIDIA SM architecture specific); (3) RTCKernel/CudaRtcKernel requires NVRTC JIT — no MUSA NVRTC. Prior MUSIFY.md already gates each via #ifdef TCNN_FULLY_FUSED_MLP / #ifdef TCNN_RTC stubs and excludes cutlass_mlp.mu from the MUSA build."
    category: missing-op
    component: musa-runtime

  solution:
    status: wontfix
    description: "Fundamental MUSA hardware/SDK gap — no upstream path for any of the three subsystems at SDK 5.1.0. Portable paths (encodings, optimizers, basic networks) verified passing 47M assertions on S5000 at SDK 4.3.6. Confirm gating + audit stubs on SDK 5.1.0; leave as documented limitation."
